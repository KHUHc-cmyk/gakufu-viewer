name: Pages に出す

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Node のテスト（整える層＋読み込み）
        run: npm test
      - name: 画面のテストの準備（Chromium）
        run: npx playwright install --with-deps chromium
      - name: 画面のテスト
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee ui-test.log
      # ログは、サインインしないと読めない。落ちたテストの名前とわけを、注記（外から読める）にも出す
      - name: 落ちたテストを注記に出す
        if: failure()
        run: node scripts/annotate-failures.js ui-test.log
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html pdf.html sw.js src vendor _site/
          # オフライン用の保存の版を、コミットごとに変える（新しい版が出たら入れ替わる）
          sed -i "s/build-local/${GITHUB_SHA}/" _site/sw.js
          grep -q "${GITHUB_SHA}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
